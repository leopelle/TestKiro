version: '3.8'

services:
  password-manager:
    build: 
      context: .
      dockerfile: Dockerfile
    image: password-manager:latest
    container_name: password-manager-app
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
      - TZ=Europe/Rome
    networks:
      - password-manager-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.password-manager.description=Secure Password Manager"
      - "com.password-manager.version=1.0.0"
    security_opt:
      - no-new-privileges:true
    read_only: false

networks:
  password-manager-network:
    driver: bridge
    name: password-manager-net
